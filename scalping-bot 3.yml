name: Bot Scalping Intraday (RSI + bougies)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le bot (decision du moment)
        run: python bot_trading_quotidien_v7.py

      - name: Sauvegarder le journal dans le depot
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal_trading*.csv commande_manuelle.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Decision du $(date -u +%Y-%m-%d\ %H:%M) UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push refuse (collision avec un autre bot), nouvelle tentative dans 5s... (essai $i)"
            sleep 5
          done
