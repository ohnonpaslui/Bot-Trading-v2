name: Bot Indices US (RSI2 Connors)

# Se declenche automatiquement toutes les heures
# + possibilite de le lancer manuellement depuis l'onglet "Actions"
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le bot indices
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python bot_trading_indices.py

      - name: Sauvegarder le journal dans le depot
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal_trading_indices.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Decision indices du $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase
          git push
