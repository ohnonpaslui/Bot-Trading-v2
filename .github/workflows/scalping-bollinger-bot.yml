name: Bot Scalping Bollinger (1 minute)

# GitHub ne garantit pas la fiabilite d'une programmation interne aussi
# frequente (1 min) : ce workflow ne garde que workflow_dispatch, et compte
# sur un declencheur externe (cron-job.org) pour l'appeler chaque minute,
# comme deja fait pour le bot scalping RSI toutes les 15-30 min.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le bot scalping Bollinger
        run: python bot_scalping_bollinger.py

      - name: Sauvegarder le journal dans le depot
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal_scalping_bollinger*.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Decision scalping du $(date -u +%Y-%m-%d\ %H:%M:%S) UTC"
          git pull --rebase
          git push
