name: Bot Trading Quotidien (MACD)

# Se déclenche automatiquement tous les jours à 8h00 heure de Paris (7h00 UTC)
# + possibilité de le lancer manuellement depuis l'onglet "Actions" sur GitHub
on:
  schedule:
    - cron: "13 7 * * *"
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour que le bot puisse sauvegarder journal_trading.csv dans le dépôt

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le bot (décision du jour)
        run: python bot_trading_quotidien_v2.py

      - name: Sauvegarder le journal dans le dépôt
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal_trading.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Décision du jour - $(date -u +%Y-%m-%d)"
          git push
