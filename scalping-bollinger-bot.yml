name: Bot Scalping Bollinger (1 minute)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le bot scalping Bollinger
        run: python bot_scalping_bollinger.py

      - name: Sauvegarder le journal dans le depot
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal_scalping_bollinger*.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Decision scalping du $(date -u +%Y-%m-%d\ %H:%M:%S) UTC"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            echo "Push refuse (collision avec un autre bot), nouvelle tentative dans 5s... (essai $i)"
            sleep 5
          done
