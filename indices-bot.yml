name: Bot Indices US (RSI2 Connors - scalping intraday)

# Se declenche toutes les 30 minutes, uniquement pendant les horaires
# d'ouverture de la bourse US (13h30-20h00 UTC = 9h30-16h00 heure de New York,
# en heure d'ete ; a ajuster de 1h en heure d'hiver), du lundi au vendredi.
on:
  schedule:
    - cron: "*/30 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer le bot indices
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot_trading_indices.py

      - name: Sauvegarder le journal dans le depot
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add journal_trading_indices.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Decision indices du $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git pull --rebase
          git push
